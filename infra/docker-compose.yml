name: carwash
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: carwash
      POSTGRES_USER: carwash
      POSTGRES_PASSWORD: carwash
    ports: ["5432:5432"]
    volumes: [carwash-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carwash"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ../backend
    environment:
      PORT: 4000
      DATABASE_URL: postgres://carwash:carwash@db:5432/carwash
      REDIS_URL: redis://redis:6379
    ports: ["4000:4000"]
    depends_on: [db, redis]
volumes:
  carwash-pg: {}
